name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini CLI Review
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review this pull request diff for:
            1. Potential bugs, edge cases, and runtime errors.
            2. Next.js 16 / React 19 best practices (App router, client vs server components).
            3. Type-safety or security issues (especially Supabase queries).
            Provide concise, actionable suggestions with code snippets.
