name: KantoPrep CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Verification (Zero Warnings)
        run: npm run lint

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Automated Vitest Suite
        run: npm test

      - name: Production Turbopack Build
        run: npm run build
